{% extends 'tourism_app/base.html' %}
{% load static %}

{% block title %}Add Testimonial - Jabalpur & Narsinghpur Tourism{% endblock %}

{% block content %}
<section class="testimonial-form-section">
  <div class="form-wrapper">
    <h2>Share Your Experience</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <label for="id_name">Name</label>
      <input type="text" name="name" id="id_name" required>

      <label for="id_email">Email</label>
      <input type="email" name="email" id="id_email" required>

      <label for="id_message">Message</label>
      <textarea name="message" id="id_message" rows="5" required></textarea>

      <label for="id_image">Upload Photo (optional)</label>
      <input type="file" name="image" id="id_image">

      <button type="submit">Submit Testimonial</button>
    </form>
  </div>
  <style>.testimonial-form-section {
  padding: 150px;
  background-color: #f7f7f7;
  display: flex;
  justify-content: center;
}

.form-wrapper {
  background: white;
  padding: 30px;
  border-radius: 8px;
  max-width: 600px;
  width: 100%;
  box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
}

.form-wrapper h2 {
  text-align: center;
  margin-bottom: 25px;
  font-size: 2rem;
  color: #333;
}

form label {
  display: block;
  margin-bottom: 8px;
  font-weight: 500;
  color: #444;
}

form input[type="text"],
form input[type="email"],
form input[type="file"],
form textarea {
  width: 100%;
  padding: 10px;
  margin-bottom: 20px;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 1rem;
  background-color: #fff;
}

form textarea {
  resize: vertical;
}

form button {
  background-color: #007b5e;
  color: white;
  padding: 12px 25px;
  border: none;
  border-radius: 5px;
  font-size: 1rem;
  cursor: pointer;
  width: 100%;
  transition: background-color 0.3s ease;
}

form button:hover {
  background-color: #005e47;
}

</style>
</section>
{% endblock %}
