{% extends 'tourism_app/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Add Service - Jabalpur & Narsinghpur Tourism{% endblock %}
{% block content %}
<section class="container">
  <h2>Add New Service</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn">Add Service</button>
  </form>
</section>
{% endblock %}
